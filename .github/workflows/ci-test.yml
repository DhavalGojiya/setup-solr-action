name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  solr-dev-test:
    name: Solr ${{ matrix.solr-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - solr-version: "8"
            configset: "tests/solr_configs/8.x.x"
          - solr-version: "9"
            configset: "tests/solr_configs/9.x.x"
          - solr-version: "10"
            configset: "tests/solr_configs/10.x.x"
    env:
      SOLR_CORE_NAME: test_core
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Apache Solr Infrastructure (Local)
        uses: ./  # Use local action.yml
        with:
          solr-version: ${{ matrix.solr-version }}
          solr-core-name: ${{ env.SOLR_CORE_NAME }}
          solr-custom-configset-path: ${{ matrix.configset }}

      - name: Verify Solr Health
        run: |
          echo "Pinging Solr Core: ${SOLR_CORE_NAME}"
          RESPONSE=$(curl -sS --fail-with-body "http://127.0.0.1:8983/solr/${SOLR_CORE_NAME}/admin/ping?wt=json" || true)

          if echo "$RESPONSE" | grep -q '"status":"OK"'; then
            echo "🎉 Solr is healthy and responding"
          else
            echo "::error title=Solr ping failed::Core ${SOLR_CORE_NAME} did not respond with status OK"
            echo "Response: $RESPONSE"
            exit 1
          fi
