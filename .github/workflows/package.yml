name: Package & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same ref to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Check package-lock.json Sync
        run: npx --yes package-lock-utd@1.1.3

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Verify dist/ is up-to-date
        run: |
          # --porcelain catches modified, deleted, AND newly added untracked files
          CHANGES=$(git status --porcelain -- dist/)
          if [ -n "$CHANGES" ]; then
            echo "::error title=dist/ out of date::Run 'npm run build' and commit the result."
            echo "$CHANGES"
            exit 1
          fi
          echo "✅ dist/ is up-to-date"
