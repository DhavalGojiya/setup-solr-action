# Keep GitHub Actions and pre-commit hooks up to date with GitHub's Dependabot...
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#package-ecosystem
version: 2
updates:
  # Bumps each pinned action SHA and its version comment in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"  # Group all Actions updates into a single larger pull request
    cooldown:
      default-days: 7  # Wait for newly released versions to settle before opening a PR (supply-chain hygiene)
    schedule:
      interval: weekly

  # Bumps each hook's `rev` in .pre-commit-config.yaml; local and meta hooks are skipped
  - package-ecosystem: pre-commit
    directory: /
    groups:
      pre-commit:
        patterns:
          - "*"  # Group all hook updates into a single larger pull request
    cooldown:
      default-days: 7  # Wait for newly released versions to settle before opening a PR (supply-chain hygiene)
    schedule:
      interval: weekly
